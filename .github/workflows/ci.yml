name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet (Linux and Windows)
        run: go vet ./... && GOOS=windows go vet ./...
      - name: Test
        run: go test ./...
      - name: Build Windows exe
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H=windowsgui -s -w" -o Kestrel.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: Kestrel-exe-dev
          path: Kestrel.exe
          retention-days: 14
