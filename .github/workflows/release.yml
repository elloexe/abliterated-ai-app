name: Release

# Builds Kestrel.exe and publishes a GitHub Release that holds everything the
# app needs offline: the llama.cpp CUDA engine, the CUDA runtime DLLs, the
# 0.8B helper model and the 9B model split into parts under 2 GiB.
# Kestrel.exe joins and SHA-256-checks the parts on first run.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  LLAMA_TAG: b12058
  MAIN_REPO: mradermacher/Huihui-Qwen3.5-9B-abliterated-i1-GGUF
  MAIN_FILE: Huihui-Qwen3.5-9B-abliterated.i1-Q4_K_M.gguf
  MAIN_SHA256: 1b251677521c3452c4e2eb8cdb1504d40d0c2e64f77cd4222cfd17cbe2d195fc
  HELPER_REPO: ggml-org/Qwen3.5-0.8B-GGUF
  HELPER_FILE: Qwen3.5-0.8B-Q8_0.gguf
  HELPER_SHA256: 37ae482d336108d23516fa35e8e0c4126688d81018b87178a18d752a1357814f
  PART_SIZE: 1900M

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          NUM="$(echo "$TAG" | sed -E 's/^v//; s/[^0-9.].*$//')"
          IFS=. read -r A B C <<< "$NUM"
          echo "winver=${A:-0}.${B:-0}.${C:-0}.0" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h .

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download llama.cpp ${{ env.LLAMA_TAG }} (Windows, CUDA 12.4) and cudart
        run: |
          mkdir -p dist
          base="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}"
          curl -fL --retry 5 --retry-all-errors -o "dist/llama-${LLAMA_TAG}-bin-win-cuda-12.4-x64.zip" "$base/llama-${LLAMA_TAG}-bin-win-cuda-12.4-x64.zip"
          curl -fL --retry 5 --retry-all-errors -o "dist/cudart-llama-bin-win-cuda-12.4-x64.zip" "$base/cudart-llama-bin-win-cuda-12.4-x64.zip"
          unzip -l "dist/llama-${LLAMA_TAG}-bin-win-cuda-12.4-x64.zip" | grep -E 'llama-server\.exe|ggml-cuda\.dll'
          unzip -l "dist/cudart-llama-bin-win-cuda-12.4-x64.zip" | grep -i 'cudart64'

      - name: Download helper model (Qwen3.5 0.8B Q8_0)
        run: |
          curl -fL --retry 5 --retry-all-errors -o "dist/${HELPER_FILE}" "https://huggingface.co/${HELPER_REPO}/resolve/main/${HELPER_FILE}"
          echo "${HELPER_SHA256}  dist/${HELPER_FILE}" | sha256sum -c -

      - name: Download main model (9B i1-Q4_K_M) and split into parts
        run: |
          url="https://huggingface.co/${MAIN_REPO}/resolve/main/${MAIN_FILE}"
          for attempt in 1 2 3; do
            rm -f dist/${MAIN_FILE}.part*
            # Stream straight into parts so the runner never holds two copies.
            if curl -fL --retry 5 --retry-all-errors "$url" \
                 | split -b "${PART_SIZE}" -d -a 2 --numeric-suffixes=1 - "dist/${MAIN_FILE}.part"; then
              got="$(cat dist/${MAIN_FILE}.part* | sha256sum | cut -d' ' -f1)"
              if [ "$got" = "${MAIN_SHA256}" ]; then
                echo "SHA-256 OK"; break
              fi
              echo "SHA-256 mismatch: $got"
            fi
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          ls -l dist

      - name: Write manifest
        run: |
          python3 tools/make_manifest.py --dist dist --tag "${{ steps.tag.outputs.tag }}" --repo "${GITHUB_REPOSITORY}" \
            --main "${MAIN_FILE}" --helper "${HELPER_FILE}" \
            --zip "llama-${LLAMA_TAG}-bin-win-cuda-12.4-x64.zip" --zip "cudart-llama-bin-win-cuda-12.4-x64.zip" > manifest.json
          cat manifest.json

      - name: Test
        run: go test ./...

      - name: Build Kestrel.exe
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          "$(go env GOPATH)/bin/go-winres" simply --arch amd64 --manifest gui --icon assets/icon.png \
            --product-name Kestrel --file-description "Kestrel - offline AI chat" --original-filename Kestrel.exe \
            --product-version "${{ steps.tag.outputs.winver }}" --file-version "${{ steps.tag.outputs.winver }}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-H=windowsgui -s -w -X main.Version=${{ steps.tag.outputs.tag }} -X main.ReleaseTag=${{ steps.tag.outputs.tag }} -X main.ReleaseRepo=${GITHUB_REPOSITORY}" \
            -o dist/Kestrel.exe .
          cp manifest.json dist/kestrel-manifest.json
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cat > notes.md <<NOTES
          **Kestrel ${TAG}**: offline AI chat for Windows with an NVIDIA GPU (8 GB VRAM or more).

          ### Install
          1. Download **every file** below into one folder (your Downloads folder is fine).
          2. Run **Kestrel.exe**. It finds the other files, checks each one with SHA-256, joins the model parts, unpacks the engine and installs to \`%LOCALAPPDATA%\\Programs\\Kestrel\` with Start menu and desktop shortcuts.
             - Or download only Kestrel.exe: it offers to fetch the rest itself (one time, about 7 GB).
          3. After that, Kestrel runs fully offline.

          Windows SmartScreen may warn because the exe is unsigned: click *More info*, then *Run anyway*.

          ### What is inside
          | File | What |
          |---|---|
          | Kestrel.exe | the app (UI, agent loop, tools, installer) |
          | ${MAIN_FILE}.part01-03 | Huihui Qwen3.5 9B abliterated, i1-Q4_K_M, split under 2 GB |
          | ${HELPER_FILE} | Qwen3.5 0.8B Q8_0: speculative draft on the GPU + CPU helper |
          | llama-${LLAMA_TAG}-bin-win-cuda-12.4-x64.zip | llama.cpp ${LLAMA_TAG} engine (CUDA 12.4) |
          | cudart-llama-bin-win-cuda-12.4-x64.zip | CUDA 12.4 runtime DLLs |
          | kestrel-manifest.json, SHA256SUMS.txt | checksums |
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Kestrel ${TAG}" --notes-file notes.md --target "${GITHUB_SHA}"
          fi
